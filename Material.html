<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title style="color: #6d28d9;">工程材料與合規文件管理系統 v80 (Auto-Save Persistence Edition)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 柔和淺紫背景與背景圖片 */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: linear-gradient(135deg, rgba(251, 250, 253, 0.92) 0%, rgba(243, 240, 247, 0.94) 100%), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover; 
            min-height: 100vh; 
            animation: fadeInBody 0.8s ease-out;
        }
        @keyframes fadeInBody {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(243, 240, 247, 0.8); }
        ::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c084fc; }

        /* 統一採用固定、專業的靜態卡片風格（無懸浮特效） */
        .static-panel {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(248, 245, 252, 0.9));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px -3px rgba(139, 92, 246, 0.08), 
                        0 2px 4px -2px rgba(139, 92, 246, 0.04);
        }

        /* 列表列淡入動畫 */
        @keyframes rowFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-row {
            animation: rowFadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-700 antialiased text-xs flex flex-col selection:bg-purple-200 selection:text-purple-950">

    <!-- 頂部導覽列 (柔和霧紫色填色) -->
    <header class="bg-purple-800 text-white shadow-md border-b border-purple-700/50 sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-purple-700/80 backdrop-blur-md flex items-center justify-center shadow-sm border border-purple-600/50 animate-pulse">
                    <i class="fa-solid fa-layer-group text-purple-200 text-sm"></i>
                </div>
                <div>
                    <span class="font-bold tracking-wider text-white text-sm">工程材料與合規資料庫</span>
                    <span class="ml-2 text-[10px] bg-purple-700 text-purple-100 border border-purple-600 px-2 py-0.5 rounded-full font-medium">自動存檔記憶版 v80</span>
                </div>
            </div>
            <div class="flex items-center space-x-2.5">
                <!-- 匯入 Excel 按鈕 -->
                <button onclick="document.getElementById('excelFileInput').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition-all duration-200 shadow-md shadow-emerald-600/25 active:scale-95">
                    <i class="fa-solid fa-file-excel"></i>
                    <span>匯入 Excel 清單</span>
                </button>
                <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelImport(event)">

                <!-- 批次上傳檔案/資料夾按鈕 -->
                <button onclick="openUploadModal()" class="bg-purple-700 hover:bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-semibold transition-all duration-200 shadow-md shadow-purple-700/30 active:scale-95">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>批次上傳原檔 / 資料夾</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="max-w-7xl mx-auto px-6 py-4 flex-1 w-full space-y-4">

        <!-- 統計與快速篩選列 (靜態面板) -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div class="static-panel p-3.5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-[11px] font-semibold text-purple-800/70 uppercase tracking-wider mb-0.5">總文件數</p>
                    <h3 id="stat-total" class="text-xl font-bold text-purple-950">0</h3>
                </div>
                <div class="w-9 h-9 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center text-sm shadow-inner">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
            </div>
            <div class="static-panel p-3.5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-[11px] font-semibold text-purple-800/70 uppercase tracking-wider mb-0.5">支援材料種類</p>
                    <h3 id="stat-categories" class="text-xl font-bold text-purple-950">0 <span class="text-xs font-normal text-slate-400">種</span></h3>
                </div>
                <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-sm shadow-inner">
                    <i class="fa-solid fa-cube"></i>
                </div>
            </div>
            <div class="static-panel p-3.5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-[11px] font-semibold text-purple-800/70 uppercase tracking-wider mb-0.5">RoHS 合規率</p>
                    <h3 id="stat-rohs" class="text-xl font-bold text-purple-950">0<span class="text-xs font-normal text-slate-400">%</span></h3>
                </div>
                <div class="w-9 h-9 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm shadow-inner">
                    <i class="fa-solid fa-shield-check"></i>
                </div>
            </div>
            <div class="static-panel p-3.5 rounded-2xl flex items-center justify-between relative overflow-hidden">
                <div class="absolute left-0 top-0 w-1.5 h-full bg-purple-500"></div>
                <div class="pl-2">
                    <p class="text-[11px] font-semibold text-purple-800/70 uppercase tracking-wider mb-0.5">需審查到期報告</p>
                    <h3 id="stat-expired" class="text-xl font-bold text-red-600">0</h3>
                </div>
                <div class="w-9 h-9 rounded-xl bg-red-100 text-red-600 flex items-center justify-center text-sm shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>
        </div>

        <!-- 搜尋、過濾與批次刪除工具列 (靜態面板) -->
        <div class="static-panel p-3 rounded-2xl flex flex-col md:flex-row gap-3 justify-between items-center">
            <!-- 關鍵字搜尋 -->
            <div class="relative w-full md:w-80 group">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 group-focus-within:text-purple-600 transition">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="搜尋檔案、材料、型號、供應商或料號..." class="w-full pl-9 pr-3 py-2 bg-purple-50/50 border border-purple-200/80 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-purple-400/30 focus:border-purple-500 focus:bg-white transition">
            </div>

            <!-- 類別標籤篩選 -->
            <div class="flex flex-wrap gap-1.5 w-full md:w-auto items-center">
                <!-- 批次刪除按鈕 (預設隱藏) -->
                <button id="batchDeleteBtn" onclick="deleteSelectedItems()" class="hidden bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center space-x-1 shadow-sm mr-1 active:scale-95">
                    <i class="fa-solid fa-trash-can"></i>
                    <span id="batchDeleteText">刪除已選</span>
                </button>

                <button onclick="filterCategory('all')" id="cat-all" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-purple-700 text-white transition shadow-sm active:scale-95">全部</button>
                <button onclick="filterCategory('TDS')" id="cat-TDS" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-purple-100 text-purple-800 hover:bg-purple-200 transition active:scale-95">TDS</button>
                <button onclick="filterCategory('MTR')" id="cat-MTR" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-purple-100 text-purple-800 hover:bg-purple-200 transition active:scale-95">MTR</button>
                <button onclick="filterCategory('SDS')" id="cat-SDS" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-purple-100 text-purple-800 hover:bg-purple-200 transition active:scale-95">SDS</button>
                <button onclick="filterCategory('ROHS')" id="cat-ROHS" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-purple-100 text-purple-800 hover:bg-purple-200 transition active:scale-95">ROHS</button>
                <button onclick="filterCategory('REACH')" id="cat-REACH" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-purple-100 text-purple-800 hover:bg-purple-200 transition active:scale-95">REACH</button>
            </div>
        </div>

        <!-- 資料表格區 (下方工程文件視窗 - 靜態面板) -->
        <div class="static-panel rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="materialTable">
                    <thead>
                        <tr class="bg-purple-100 text-purple-950 uppercase text-[10px] tracking-wider border-b border-purple-200">
                            <th class="py-2.5 px-3 w-8 text-center">
                                <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" class="rounded border-purple-300 bg-white text-purple-700 focus:ring-purple-500 cursor-pointer">
                            </th>
                            <th class="py-2.5 px-3 font-semibold">文件類型</th>
                            <th class="py-2.5 px-3 font-semibold">材料名稱</th>
                            <th class="py-2.5 px-3 font-semibold">材質/型號 <span class="text-[9px] text-purple-700 font-normal">(雙擊修改)</span></th>
                            <th class="py-2.5 px-3 font-semibold">供應商 <span class="text-[9px] text-purple-700 font-normal">(雙擊修改)</span></th>
                            <th class="py-2.5 px-3 font-semibold">廠內料號 <span class="text-[9px] text-purple-700 font-normal">(雙擊修改)</span></th>
                            <th class="py-2.5 px-3 font-semibold">報告日期</th>
                            <th class="py-2.5 px-3 font-semibold">報告到期日</th>
                            <th class="py-2.5 px-3 font-semibold text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-purple-50 text-xs" id="tableBody">
                        <!-- 動態生成 -->

                </table>
            </div>
            <div id="noData" class="py-16 text-center text-slate-400">
                <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-2.5 shadow-inner">
                    <i class="fa-solid fa-folder-open text-lg"></i>
                </div>
                <p class="text-xs font-medium">目前尚無上傳任何工程文件，請點擊上方按鈕匯入或上傳檔案</p>
            </div>
        </div>

    </main>

    <!-- 批次上傳與選擇資料夾彈窗 Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="static-panel rounded-3xl max-w-xl w-full p-5 shadow-2xl max-h-[90vh] flex flex-col text-xs">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-purple-800 flex items-center space-x-2 text-xs">
                    <i class="fa-solid fa-folder-tree text-purple-600 text-sm"></i>
                    <span>批次上傳原檔 / 選擇資料夾預覽 (智慧識別)</span>
                </h3>
                <button onclick="closeUploadModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <div class="flex border-b border-purple-100 mb-3">
                <button type="button" onclick="switchUploadTab('files')" id="tabFilesBtn" class="flex-1 py-1.5 font-semibold text-purple-800 border-b-2 border-purple-600 transition text-xs">選擇多個原檔</button>
                <button type="button" onclick="switchUploadTab('folder')" id="tabFolderBtn" class="flex-1 py-1.5 font-semibold text-slate-400 hover:text-slate-600 transition text-xs">選擇整個資料夾</button>
            </div>

            <form id="uploadForm" onsubmit="handleBatchUpload(event)" class="space-y-3 overflow-y-auto flex-1 pr-0.5">
                <div id="sectionFiles" class="space-y-1">
                    <label class="block font-semibold text-purple-900 uppercase mb-0.5 text-[10px]">上傳原始 PDF / Excel 檔案</label>
                    <input type="file" id="batchFiles" multiple accept=".pdf, .xlsx, .xls, .doc, .docx" onchange="handleFileSelection(this)" class="w-full text-slate-500 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-100 file:text-purple-800 hover:file:bg-purple-200 transition border border-purple-200 rounded-xl p-1 bg-white">
                    <p class="text-[10px] text-slate-400">支援格式：<code>材料名稱-型號-供應商-文件類型-日期(廠內料號)</code></p>
                </div>

                <div id="sectionFolder" class="space-y-1 hidden">
                    <label class="block font-semibold text-purple-900 uppercase mb-0.5 text-[10px]">選擇本機資料夾</label>
                    <input type="file" id="batchFolder" webkitdirectory directory multiple onchange="handleFileSelection(this)" class="w-full text-slate-500 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-100 file:text-purple-800 hover:file:bg-purple-200 transition border border-purple-200 rounded-xl p-1 bg-white">
                </div>

                    </div>
                    <div class="max-h-36 overflow-y-auto space-y-1.5 pr-1 text-[10px]" id="previewList"></div>
                </div>

                <div class="flex justify-end space-x-2 pt-2 border-t border-purple-100">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium transition text-xs">取消</button>
                    <button type="submit" id="submitUploadBtn" class="px-5 py-2 bg-purple-700 hover:bg-purple-600 text-white rounded-xl font-medium transition shadow-sm opacity-50 pointer-events-none text-xs flex items-center space-x-1 active:scale-95">
                        <i class="fa-solid fa-check"></i><span>確認匯入</span>

                </div>
            </form>

    <!-- 檢視與原檔下載 Modal -->
    <div id="viewModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="static-panel rounded-3xl max-w-md w-full p-5 shadow-2xl text-xs">
            <div class="flex justify-between items-center mb-3">

            <!-- 原檔下載專區 -->

                    <div class="truncate">
                        <p class="font-bold text-slate-700 text-[10px]">原始檔案已就緒</p>
                        <p id="viewFileName" class="text-slate-500 text-[10px] truncate font-mono"></p>
                    </div>
                </div>
                <div>
                    <a id="downloadOriginalBtn" href="#" target="_blank" class="bg-purple-700 hover:bg-purple-600 text-white px-4 py-2 rounded-xl font-semibold transition shadow-sm shrink-0 active:scale-95 flex items-center space-x-1.5">

            <div class="flex justify-end">
                <button onclick="closeViewModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium transition text-xs">關閉</button>

    <!-- JavaScript 互動邏輯 (含 LocalStorage 自動持久化儲存與載入) -->
    <script>
        // 從 LocalStorage 載入已儲存的狀態，若無則預設為空陣列
        let materialsData = [];
        try {
            const savedData = localStorage.getItem('materials_hub_data_v80');
            if (savedData) {
                materialsData = JSON.parse(savedData);
            }
        } catch (e) {
            console.error('載入儲存狀態失敗:', e);
            materialsData = [];
        }

        let currentFilter = 'all';
        let uploadMode = 'files';
        let activeItem = null;
        let stagedFilesArray = [];

        const KNOWN_SUPPLIERS = ['中鋼', '艾仕特', '昇華', 'SGS', '台灣鋁業', '中石化', '台塑', '中鴻', '豐興', '台積電', '日月光', '長春化學', '南亞'];

        // 自動儲存狀態至 LocalStorage
        function saveToLocalStorage() {
            try {
                localStorage.setItem('materials_hub_data_v80', JSON.stringify(materialsData));
            } catch (e) {
                console.error('儲存狀態失敗:', e);
            }
        }

        function calculateExpiry(type, reportDateStr) {
            let upperType = (type || '').toUpperCase();
            if (upperType === 'TDS' || upperType === 'MTR' || upperType === 'SDS' || upperType === 'MSDS') {
                return { expiryText: '無限制期限', status: 'none', isExpired: false };
            }
            if (!reportDateStr) {
                return { expiryText: '未判定', status: 'none', isExpired: false };
            }

            let repDate = new Date(reportDateStr);
            if (isNaN(repDate.getTime())) return { expiryText: '日期格式有誤', status: 'none', isExpired: false };

            let expDate = new Date(repDate);
            if (upperType === 'ROHS') {
                expDate.setFullYear(expDate.getFullYear() + 2);
            } else if (upperType === 'REACH') {
                expDate.setFullYear(expDate.getFullYear() + 1);
            } else {
                expDate.setFullYear(expDate.getFullYear() + 1);
            }

            let expiryText = expDate.toISOString().split('T')[0];
            let today = new Date();
            today.setHours(0,0,0,0);

            let diffTime = expDate - today;
            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (expDate < today) {
                return { expiryText, status: 'expired', isExpired: true };
            } else if (diffDays <= 30) {
                return { expiryText, status: 'warning', isExpired: false };
            } else {
                return { expiryText, status: 'valid', isExpired: false };
            }
        }

        function makeEditable(element, id, field) {
            const currentValue = element.innerText;
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentValue;
            input.className = 'w-full px-1.5 py-0.5 bg-white border border-purple-400 rounded text-xs focus:outline-none focus:ring-1 focus:ring-purple-400 shadow-sm';

            input.onblur = function() { saveValue(id, field, input.value); };
            input.onkeydown = function(e) {
                if (e.key === 'Enter') input.blur();
                else if (e.key === 'Escape') renderTable(filterCurrentData());
            };

            element.innerHTML = '';
            element.appendChild(input);
            input.focus();
            input.select();
        }

        function saveValue(id, field, newValue) {
            const item = materialsData.find(i => i.id === id);
            if (item) item[field] = newValue.trim() || '未指定';
            saveToLocalStorage(); // 自動儲存狀態
            renderTable(filterCurrentData());
        }

        function switchUploadTab(mode) {
            uploadMode = mode;
            const tabFilesBtn = document.getElementById('tabFilesBtn');
            const tabFolderBtn = document.getElementById('tabFolderBtn');
            const sectionFiles = document.getElementById('sectionFiles');
            const sectionFolder = document.getElementById('sectionFolder');

            document.getElementById('batchFiles').value = '';
            document.getElementById('batchFolder').value = '';
            stagedFilesArray = [];
            renderPreviewList();

            if (mode === 'files') {
                tabFilesBtn.className = "flex-1 py-1.5 font-semibold text-purple-800 border-b-2 border-purple-600 transition text-xs";
                tabFolderBtn.className = "flex-1 py-1.5 font-semibold text-slate-400 hover:text-slate-600 transition text-xs";
                sectionFiles.classList.remove('hidden');
                sectionFolder.classList.add('hidden');
            } else {
                tabFolderBtn.className = "flex-1 py-1.5 font-semibold text-purple-800 border-b-2 border-purple-600 transition text-xs";
                tabFilesBtn.className = "flex-1 py-1.5 font-semibold text-slate-400 hover:text-slate-600 transition text-xs";
                sectionFolder.classList.remove('hidden');
                sectionFiles.classList.add('hidden');
            }
        }

        function parseFileInfo(fileName) {
            let nameWithoutExt = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
            
            let materialName = '未命名材料';
            let model = '未指定型號';
            let supplier = '未指定供應商';
            let docType = 'TDS';
            let reportDate = new Date().toISOString().split('T')[0];
            let partNo = '未指定';

            let matchParen = nameWithoutExt.match(/\(([^)]+)\)/);
            if (matchParen) partNo = matchParen[1];

            let cleanBaseName = nameWithoutExt.replace(/\s*\(.*\)/, '');
            let parts = cleanBaseName.split('-');

            if (parts.length > 0 && parts[0]) materialName = parts[0].trim();

            for (let part of parts) {
                let cleanPart = part.trim();
                for (let known of KNOWN_SUPPLIERS) {
                    if (cleanPart.includes(known) || cleanPart.toUpperCase() === known.toUpperCase()) {
                        supplier = cleanPart;
                        break;
                    }
                }
                if (supplier !== '未指定供應商') break;
            }

            let typeIdx = -1;
            let dateIdx = -1;

            parts.forEach((part, idx) => {
                let clean = part.trim().toUpperCase();
                if (['TDS', 'MTR', 'SDS', 'MSDS', 'ROHS', 'REACH'].includes(clean)) {
                    docType = clean === 'MSDS' ? 'SDS' : clean;
                    typeIdx = idx;
                }
                if (part.trim().match(/^(\d{6,8})$/)) {
                    let numStr = part.trim();
                    if (numStr.length === 8) reportDate = `${numStr.substring(0,4)}-${numStr.substring(4,6)}-${numStr.substring(6,8)}`;
                    else if (numStr.length === 6) reportDate = `20${numStr.substring(0,2)}-${numStr.substring(2,4)}-${numStr.substring(4,6)}`;
                    dateIdx = idx;
                }
            });

            if (supplier === '未指定供應商' && typeIdx > 1) supplier = parts[typeIdx - 1].trim();

            let modelParts = [];
            parts.forEach((part, idx) => {
                let clean = part.trim();
                let upper = clean.toUpperCase();
                if (idx > 0 && clean !== materialName && clean !== supplier && !['TDS', 'MTR', 'SDS', 'MSDS', 'ROHS', 'REACH'].includes(upper) && !clean.match(/^(\d{6,8})$/)) {
                    modelParts.push(clean);
                }
            });

            if (modelParts.length > 0) model = modelParts.join('-');

            return { materialName, model, supplier, partNo, docType, reportDate };
        }

        function handleFileSelection(inputElement) {
            const files = inputElement.files;
            if (!files || files.length === 0) return;
            stagedFilesArray = Array.from(files);
            renderPreviewList();
        }

        function renderPreviewList() {
            const previewContainer = document.getElementById('previewContainer');
            const previewList = document.getElementById('previewList');
            const previewCount = document.getElementById('previewCount');
            const submitBtn = document.getElementById('submitUploadBtn');

            previewList.innerHTML = '';

            if (stagedFilesArray.length === 0) {
                previewContainer.classList.add('hidden');
                submitBtn.classList.add('opacity-50', 'pointer-events-none');
                return;
            }

            previewCount.innerText = stagedFilesArray.length;
            previewContainer.classList.remove('hidden');
            submitBtn.classList.remove('opacity-50', 'pointer-events-none');

            stagedFilesArray.forEach((file, index) => {
                const info = parseFileInfo(file.name);
                let badgeClass = 'bg-purple-100 text-purple-800 border-purple-200';
                if(info.docType === 'ROHS' || info.docType === 'REACH') badgeClass = 'bg-indigo-100 text-indigo-800 border-indigo-200';

                const div = document.createElement('div');
                div.className = "bg-white p-2 rounded-xl border border-purple-100 flex items-center justify-between gap-2 shadow-sm animate-row";
                div.innerHTML = `
                    <div class="truncate flex-1">
                        <div class="font-bold text-slate-800 truncate"><i class="fa-solid fa-file text-purple-400 mr-1"></i> ${file.name}</div>
                        <div class="flex flex-wrap gap-x-2 text-slate-500 text-[10px] mt-0.5 items-center">
                            <span class="${badgeClass} px-1.5 py-0.5 rounded font-bold border">${info.docType}</span>
                            <span>材料: <b>${info.materialName}</b></span>
                            <span>型號: <b class="text-purple-700">${info.model}</b></span>
                            <span>供應商: <b class="text-indigo-700">${info.supplier}</b></span>
                            <span>料號: <b class="text-emerald-700">${info.partNo}</b></span>
                            <span>日期: <b>${info.reportDate}</b></span>
                        </div>
                    </div>
                    <button type="button" onclick="removeStagedFile(${index})" class="text-slate-400 hover:text-red-500 p-1 transition" title="移除">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                previewList.appendChild(div);
            });
        }

        function removeStagedFile(index) {
            stagedFilesArray.splice(index, 1);
            renderPreviewList();
        }

        function filterCurrentData() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            return materialsData.filter(item => {
                const expiry = calculateExpiry(item.type, item.reportDate);
                const matchCategory = (currentFilter === 'all' || item.type === currentFilter);
                const matchKeyword = item.type.toLowerCase().includes(keyword) || 
                                     item.name.toLowerCase().includes(keyword) || 
                                     item.supplier.toLowerCase().includes(keyword) || 
                                     (item.model && item.model.toLowerCase().includes(keyword)) ||
                                     (item.partNo && item.partNo.toLowerCase().includes(keyword)) ||
                                     item.reportDate.toLowerCase().includes(keyword) ||
                                     expiry.expiryText.toLowerCase().includes(keyword);
                return matchCategory && matchKeyword;
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const noData = document.getElementById('noData');
            tbody.innerHTML = '';

            document.getElementById('stat-total').innerText = materialsData.length;
            
            // 計算不重複的材料種類數與 RoHS 合規率
            const uniqueCategories = new Set(materialsData.map(i => i.name)).size;
            document.getElementById('stat-categories').innerHTML = `${uniqueCategories} <span class="text-xs font-normal text-slate-400">種</span>`;
            
            const rohsCount = materialsData.filter(i => i.type === 'ROHS').length;
            const rohsRate = materialsData.length > 0 ? Math.round((materialsData.filter(i => calculateExpiry(i.type, i.reportDate).status !== 'expired').length / materialsData.length) * 100) : 0;
            document.getElementById('stat-rohs').innerHTML = `${rohsRate}<span class="text-xs font-normal text-slate-400">%</span>`;

            document.getElementById('selectAll').checked = false;

            let expiredCount = 0;

            if (data.length === 0) {
                noData.classList.remove('hidden');
                document.getElementById('stat-expired').innerText = 0;
                updateBatchDeleteBtn();
                return;
            } else {
                noData.classList.add('hidden');
            }

            data.forEach((item, idx) => {
                let badgeClass = '';
                switch(item.type) {
                    case 'TDS': badgeClass = 'bg-purple-100 text-purple-800 border-purple-200'; break;
                    case 'MTR': badgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-200'; break;
                    case 'SDS': badgeClass = 'bg-amber-100 text-amber-800 border-emerald-200'; break;
                    case 'ROHS': badgeClass = 'bg-purple-100 text-purple-800 border-purple-200'; break;
                    case 'REACH': badgeClass = 'bg-indigo-100 text-indigo-800 border-indigo-200'; break;
                }

                const expiry = calculateExpiry(item.type, item.reportDate);
                if (expiry.status === 'expired') expiredCount++;

                let expiryBadge = `<span class="text-slate-600">${expiry.expiryText}</span>`;
                if (expiry.status === 'expired') {
                    expiryBadge = `<span class="bg-red-100 text-red-700 px-2.5 py-0.5 rounded-md font-bold animate-pulse inline-flex items-center space-x-1"><i class="fa-solid fa-circle-exclamation mr-1"></i><span>已過期 (${expiry.expiryText})</span></span>`;
                } else if (expiry.status === 'warning') {
                    expiryBadge = `<span class="bg-amber-100 text-amber-700 px-2.5 py-0.5 rounded-md font-semibold inline-flex items-center space-x-1"><i class="fa-solid fa-clock mr-1"></i><span>即將到期 (${expiry.expiryText})</span></span>`;
                } else if (expiry.status === 'none') {
                    expiryBadge = `<span class="text-slate-400 italic">${expiry.expiryText}</span>`;
                }

                const tr = document.createElement('tr');
                tr.className = `transition border-b border-purple-50 animate-row ${expiry.status === 'expired' ? 'bg-red-50/40 hover:bg-red-50/80' : 'hover:bg-purple-50/50'}`;
                tr.style.animationDelay = `${idx * 0.04}s`;
                tr.innerHTML = `
                    <td class="py-2 px-3 text-center">
                        <input type="checkbox" value="${item.id}" onclick="updateBatchDeleteBtn()" class="row-checkbox rounded border-slate-300 text-purple-600 focus:ring-purple-500 cursor-pointer">
                    </td>
                    <td class="py-2 px-3">
                        <span class="inline-block px-2.5 py-0.5 font-semibold rounded-md border ${badgeClass}">${item.type}</span>
                    </td>
                    <td class="py-2 px-3 font-semibold text-slate-800">${item.name}</td>
                    <td class="py-2 px-3 text-slate-700 font-mono text-[11px] bg-white/80 rounded-lg cursor-pointer hover:bg-purple-50/60 transition group" ondblclick="makeEditable(this, ${item.id}, 'model')" title="雙擊可修改型號">
                        <span class="border-b border-dashed border-purple-200 group-hover:border-purple-600">${item.model || '未指定'}</span>
                    </td>
                    <td class="py-2 px-3 text-slate-800 font-medium cursor-pointer hover:bg-purple-50/60 transition group" ondblclick="makeEditable(this, ${item.id}, 'supplier')" title="雙擊可修改供應商">
                        <span class="border-b border-dashed border-purple-200 group-hover:border-purple-600">${item.supplier}</span>
                    </td>
                    <td class="py-2 px-3 text-emerald-800 font-mono text-[11px] bg-emerald-50/80 rounded-lg cursor-pointer hover:bg-purple-50/60 transition group" ondblclick="makeEditable(this, ${item.id}, 'partNo')" title="雙擊可修改廠內料號">
                        <span class="border-b border-dashed border-emerald-300 group-hover:border-emerald-600">${item.partNo || '未指定'}</span>
                    </td>
                    <td class="py-2 px-3 text-slate-600">${item.reportDate}</td>
                    <td class="py-2 px-3">${expiryBadge}</td>
                    <td class="py-2 px-3 text-center space-x-1">
                        <button onclick="viewItem(${item.id})" class="text-purple-700 hover:text-purple-900 p-1 rounded-lg hover:bg-purple-100 transition" title="檢視原檔與下載">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                        <button onclick="deleteSingleItem(${item.id})" class="text-slate-400 hover:text-red-600 p-1 rounded-lg hover:bg-red-50 transition" title="刪除文件">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-expired').innerText = expiredCount;
            updateBatchDeleteBtn();
        }

        function toggleSelectAll(masterCheckbox) {
            document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = masterCheckbox.checked);
            updateBatchDeleteBtn();
        }

        function updateBatchDeleteBtn() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const btn = document.getElementById('batchDeleteBtn');
            const btnText = document.getElementById('batchDeleteText');
            if (checkedBoxes.length > 0) {
                btn.classList.remove('hidden');
                btn.classList.add('flex');
                btnText.innerText = `刪除已選 (${checkedBoxes.length})`;
            } else {
                btn.classList.remove('flex');
                btn.classList.add('hidden');
            }
        }

        function deleteSelectedItems() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if (checkedBoxes.length === 0) return;
            if (confirm(`確定要刪除選取的 ${checkedBoxes.length} 筆工程文件嗎？`)) {
                const idsToDelete = Array.from(checkedBoxes).map(cb => parseInt(cb.value));
                materialsData = materialsData.filter(item => !idsToDelete.includes(item.id));
                saveToLocalStorage(); // 自動更新儲存狀態
                filterTable();
            }
        }

        function deleteSingleItem(id) {
            if (confirm('確定要刪除這筆工程文件紀錄嗎？')) {
                materialsData = materialsData.filter(i => i.id !== id);
                saveToLocalStorage(); // 自動更新儲存狀態
                filterTable();
            }
        }

        function filterCategory(category) {
            currentFilter = category;
            const btnBase = 'category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold transition shadow-sm';
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = `${btnBase} bg-purple-100 text-purple-800 hover:bg-purple-200`;
            });
            document.getElementById(`cat-${category}`).className = `${btnBase} bg-purple-700 text-white`;
            filterTable();
        }

        function filterTable() {
            renderTable(filterCurrentData());
        }

        function openUploadModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadForm').reset();
            stagedFilesArray = [];
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('submitUploadBtn').classList.add('opacity-50', 'pointer-events-none');
            switchUploadTab('files');
        }

        function handleBatchUpload(event) {
            event.preventDefault();
            if (stagedFilesArray.length === 0) return;

            let addedCount = 0;
            let nextId = materialsData.length > 0 ? Math.max(...materialsData.map(i => i.id)) + 1 : 1;

            stagedFilesArray.forEach(file => {
                const info = parseFileInfo(file.name);
                const fileBlobUrl = URL.createObjectURL(file);

                materialsData.unshift({
                    id: nextId++,
                    type: info.docType,
                    name: info.materialName,
                    model: info.model,
                    supplier: info.supplier,
                    partNo: info.partNo,
                    reportDate: info.reportDate,
                    fileName: file.name,
                    fileUrl: fileBlobUrl
                });
                addedCount++;
            });

            saveToLocalStorage(); // 自動儲存最新狀態
            filterTable();
            closeUploadModal();
            alert(`成功自動識別並匯入 ${addedCount} 筆檔案，狀態已自動儲存！`);
        }

        function handleExcelImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    if (json.length === 0) { alert('Excel 無資料'); return; }

                    let nextId = materialsData.length > 0 ? Math.max(...materialsData.map(i => i.id)) + 1 : 1;
                    let importCount = 0;

                    json.forEach(row => {
                        const type = (row['文件類型'] || row['Type'] || 'TDS').toString().toUpperCase();
                        const name = row['材料名稱'] || row['Name'] || '未命名材料';
                        const model = row['材質/型號'] || row['Model'] || '未指定型號';
                        const supplier = row['供應商'] || row['Supplier'] || '未指定供應商';
                        const partNo = row['廠內料號'] || row['PartNo'] || '未指定';
                        const reportDate = row['報告日期'] || row['ReportDate'] || new Date().toISOString().split('T')[0];

                        materialsData.unshift({
                            id: nextId++,
                            type: ['TDS', 'MTR', 'SDS', 'ROHS', 'REACH'].includes(type) ? type : 'TDS',
                            name: name,
                            model: model,
                            supplier: supplier,
                            partNo: partNo,
                            reportDate: reportDate,
                            fileName: `${name}.xlsx`,
                            fileUrl: '#'
                        });
                        importCount++;
                    });
                    
                    saveToLocalStorage(); // 自動儲存最新狀態
                    filterTable();
                    alert(`成功從 Excel 匯入 ${importCount} 筆資料，狀態已自動儲存！`);
                } catch (err) {
                    alert('Excel 解析失敗');
                }
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        function viewItem(id) {
            activeItem = materialsData.find(i => i.id === id);
            if (!activeItem) return;

            const expiry = calculateExpiry(activeItem.type, activeItem.reportDate);

            document.getElementById('viewTitle').innerText = activeItem.fileName;
            document.getElementById('viewType').innerText = activeItem.type;
            document.getElementById('viewName').innerText = activeItem.name;
            document.getElementById('viewModel').innerText = activeItem.model || '未指定';
            document.getElementById('viewSupplier').innerText = activeItem.supplier;
            document.getElementById('viewPartNo').innerText = activeItem.partNo || '未指定';
            document.getElementById('viewReportDate').innerText = activeItem.reportDate;
            document.getElementById('viewExpiryDate').innerText = expiry.expiryText;
            document.getElementById('viewFileName').innerText = activeItem.fileName;

            const downloadBtn = document.getElementById('downloadOriginalBtn');
            if (activeItem.fileUrl && activeItem.fileUrl !== '#') {
                downloadBtn.href = activeItem.fileUrl;
                downloadBtn.download = activeItem.fileName;
                downloadBtn.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                downloadBtn.href = '#';
                downloadBtn.removeAttribute('download');
                downloadBtn.classList.add('opacity-50', 'pointer-events-none');
            }

            document.getElementById('viewModal').classList.remove('hidden');
            document.getElementById('viewModal').classList.add('flex');
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('hidden');
            document.getElementById('viewModal').classList.add('hidden');
        }

        window.onload = function() {
            renderTable(materialsData);
        };
    </script>
</body>
</html>
