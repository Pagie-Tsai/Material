<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title style="color: #6d28d9;">工程材料與合規文件管理系統 v103 (All-Compliance Multi-Color Edition)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 柔和淺紫背景與背景圖片 */
        html {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, rgba(251, 250, 253, 0.92) 0%, rgba(243, 240, 247, 0.94) 100%),
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            animation: fadeInBody 0.8s ease-out;
        }
        @keyframes fadeInBody {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(243, 240, 247, 0.8); }
        ::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c084fc; }

        /* 靜態卡片面板風格 */
        .static-panel {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(248, 245, 252, 0.9));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px -3px rgba(139, 92, 246, 0.08),
                        0 2px 4px -2px rgba(139, 92, 246, 0.04);
        }

        /* 列表列淡入動畫 */
        @keyframes rowFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-row {
            animation: rowFadeIn 0.3s ease-out forwards;
        }

        /* 篩選圖標閃爍動畫 */
        @keyframes filterIconBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .filter-icon-blinking {
            animation: filterIconBlink 1s ease-in-out infinite;
        }

        /* 表頭凍結 - 垂直捲軸時固定 */
        #materialTable thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(248, 245, 252, 0.95));
            backdrop-filter: blur(16px);
            box-shadow: 0 2px 8px -2px rgba(139, 92, 246, 0.15);
        }

        /* 表格欄位垂直線區隔 */
        #materialTable td {
            border-right: 1px solid rgba(180, 100, 240, 0.5) !important;
        }
        #materialTable td:last-child {
            border-right: none !important;
        }

        /* 表頭樣式 - 淺粉色底色，取消垂直線 */
        #materialTable thead tr {
            background-color: rgba(252, 207, 232, 0.6) !important;
        }
        #materialTable thead th {
            border-right: none !important;
            border-color: transparent !important;
            box-shadow: none !important;
            color: rgba(109, 40, 217, 0.9) !important;
        }
    </style>
</head>
<body class="text-slate-700 antialiased text-xs flex flex-col selection:bg-purple-200 selection:text-purple-950">

    <!-- 頂部導覽列 (柔和霧紫色填色) -->
    <header class="bg-purple-800 text-white shadow-md border-b border-purple-700/50 sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-4 py-1.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-purple-700/80 backdrop-blur-md flex items-center justify-center shadow-sm border border-purple-600/50 animate-pulse">
                    <i class="fa-solid fa-layer-group text-purple-200 text-sm"></i>
                </div>
                <div>
                    <span class="font-bold tracking-wider text-white text-sm">工程材料與合規資料庫</span>
                    <span class="ml-2 text-[10px] bg-purple-700 text-purple-100 border border-purple-600 px-2 py-0.5 rounded-full font-medium">全系列多彩視覺版 v103</span>
                </div>
            </div>
            <div class="flex items-center space-x-2.5">
                <!-- 匯入 Excel 按鈕 -->
                <button onclick="document.getElementById('excelFileInput').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition-all duration-200 shadow-md shadow-emerald-600/25 active:scale-95">
                    <i class="fa-solid fa-file-excel"></i>
                    <span>匯入 Excel 清單</span>
                </button>
                <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelImport(event)">

                <!-- 批次上傳檔案/資料夾按鈕 -->
                <button onclick="openUploadModal()" class="bg-purple-700 hover:bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-semibold transition-all duration-200 shadow-md shadow-purple-700/30 active:scale-95">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>批次上傳原檔 / 資料夾</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="max-w-7xl mx-auto px-6 py-2 flex-1 w-full space-y-2 flex flex-col h-screen overflow-hidden">

        <!-- 統計與快速篩選列 (極縮小版) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-0.5 flex-shrink-0">
            <div class="static-panel p-1 rounded-lg flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-semibold text-purple-800/70 uppercase tracking-wider leading-tight">總數</p>
                    <h3 id="stat-total" class="text-xs font-bold text-purple-950">0</h3>
                </div>
                <div class="w-5 h-5 rounded-lg bg-purple-100 text-purple-700 flex items-center justify-center text-[10px] shadow-inner">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
            </div>
            <div class="static-panel p-1 rounded-lg flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-semibold text-purple-800/70 uppercase tracking-wider leading-tight">種類</p>
                    <h3 id="stat-categories" class="text-xs font-bold text-purple-950">0</h3>
                </div>
                <div class="w-5 h-5 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center text-[10px] shadow-inner">
                    <i class="fa-solid fa-cube"></i>
                </div>
            </div>
            <div class="static-panel p-1 rounded-lg flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-semibold text-purple-800/70 uppercase tracking-wider leading-tight">合規</p>
                    <h3 id="stat-rohs" class="text-xs font-bold text-purple-950">0%</h3>
                </div>
                <div class="w-5 h-5 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center text-[10px] shadow-inner">
                    <i class="fa-solid fa-shield-check"></i>
                </div>
            </div>
            <div class="static-panel p-1 rounded-lg flex items-center justify-between relative overflow-hidden">
                <div class="absolute left-0 top-0 w-0.5 h-full bg-red-500"></div>
                <div class="pl-0.5">
                    <p class="text-[10px] font-semibold text-purple-800/70 uppercase tracking-wider leading-tight">到期</p>
                    <h3 id="stat-expired" class="text-xs font-bold text-red-600">0</h3>
                </div>
                <div class="w-5 h-5 rounded-lg bg-red-100 text-red-600 flex items-center justify-center text-[10px] shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>
        </div>

        <!-- 搜尋、過濾與批次刪除工具列 (縮小版) -->
        <div class="static-panel p-1 rounded-lg flex flex-col md:flex-row gap-1 justify-between items-center flex-shrink-0">
            <!-- 關鍵字搜尋 -->
            <div class="relative w-full md:w-52 group flex items-center gap-1">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-2 text-slate-400 group-focus-within:text-purple-600 transition">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="搜尋..." class="w-full pl-7 pr-2 py-0.5 bg-purple-50/50 border border-purple-200/80 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-purple-400/30 focus:border-purple-500 focus:bg-white transition">
                </div>
                <button onclick="clearSearch()" class="px-2 py-0.5 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-lg text-xs font-semibold transition" title="清除搜尋">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 類別標籤篩選 -->
            <div class="flex flex-wrap gap-1 w-full md:w-auto items-center text-[10px]">
                <!-- 批次刪除按鈕 -->
                <button id="batchDeleteBtn" onclick="deleteSelectedItems()" class="hidden bg-red-600 hover:bg-red-500 text-white px-2.5 py-1 rounded-lg font-semibold transition flex items-center space-x-1 shadow-sm active:scale-95">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                    <span id="batchDeleteText">刪除</span>
                </button>

                <button onclick="filterCategory('all')" id="cat-all" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-purple-700 text-white transition shadow-sm active:scale-95 text-[10px]">全部</button>
                <button onclick="filterCategory('UL94')" id="cat-UL94" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-cyan-100 text-cyan-800 hover:bg-cyan-200 transition active:scale-95 text-[10px]">UL94</button>
                <button onclick="filterCategory('TDS')" id="cat-TDS" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-purple-100 text-purple-800 hover:bg-purple-200 transition active:scale-95 text-[10px]">TDS</button>
                <button onclick="filterCategory('COA')" id="cat-COA" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-yellow-100 text-yellow-800 hover:bg-yellow-200 transition active:scale-95 text-[10px]">COA</button>
                <button onclick="filterCategory('SDS')" id="cat-SDS" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-orange-100 text-orange-800 hover:bg-orange-200 transition active:scale-95 text-[10px]">SDS</button>
                <button onclick="filterCategory('ROHS')" id="cat-ROHS" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-red-100 text-red-800 hover:bg-red-200 transition active:scale-95 text-[10px]">ROHS</button>
                <button onclick="filterCategory('REACH')" id="cat-REACH" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-green-100 text-green-800 hover:bg-green-200 transition active:scale-95 text-[10px]">REACH</button>
                <button onclick="filterCategory('PFAS')" id="cat-PFAS" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-orange-200 text-orange-800 hover:bg-orange-300 transition active:scale-95 text-[10px]">PFAS</button>
                <button onclick="filterCategory('PFOA、PFOS')" id="cat-PFOA、PFOS" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition active:scale-95 text-[10px]">PFOA/PFOS</button>
                <button onclick="filterCategory('鹵素')" id="cat-鹵素" class="category-btn px-2.5 py-0.5 rounded-lg font-semibold bg-pink-200 text-pink-800 hover:bg-pink-300 transition active:scale-95 text-[10px]">鹵素</button>

                <!-- 備份和自動儲存按鈕 -->
                <button onclick="exportData()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-lg font-semibold transition shadow-sm active:scale-95 flex items-center space-x-1" title="匯出備份">
                    <i class="fa-solid fa-download text-xs"></i>
                    <span>匯出備份</span>
                </button>
                <button onclick="document.getElementById('importFile').click()" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded-lg font-semibold transition shadow-sm active:scale-95 flex items-center space-x-1" title="匯入備份">
                    <i class="fa-solid fa-upload text-xs"></i>
                    <span>匯入備份</span>
                </button>
                <button onclick="openBackupListModal()" class="bg-purple-700 hover:bg-purple-600 text-white px-3 py-1 rounded-lg font-semibold transition shadow-sm active:scale-95 flex items-center space-x-1" title="自動備份清單">
                    <i class="fa-solid fa-clock-rotate-left text-xs"></i>
                    <span>備份清單</span>
                </button>
                <button id="notifyBtn" onclick="enableBrowserNotifications()" class="bg-amber-500 hover:bg-amber-400 text-white px-3 py-1 rounded-lg font-semibold transition shadow-sm active:scale-95 flex items-center space-x-1" title="開啟瀏覽器桌面通知">
                    <i class="fa-solid fa-bell text-xs"></i>
                    <span id="notifyBtnText">開啟桌面提醒</span>
                </button>
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
            </div>
        </div>

        <!-- 資料表格區 (下方工程文件視窗 - 靜態面板) -->
        <div class="static-panel rounded-lg overflow-y-auto flex-1 flex flex-col min-h-0">
            <div>
                <table class="w-full text-left border-collapse" id="materialTable">
                    <thead>
                        <tr class="bg-purple-100 text-purple-950 uppercase text-[10px] tracking-wider border-b border-purple-200">
                            <th class="py-1 px-2 w-8 text-center">
                                <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" class="rounded border-purple-300 bg-white text-purple-700 focus:ring-purple-500 cursor-pointer">
                            </th>
                            <th class="py-1 pl-0.5 pr-3 font-semibold relative text-center" style="width: 20px;">
                                文件類型
                                <button onclick="showColumnFilter('type', this)" class="absolute right-0.5 top-1/2 -translate-y-1/2 text-purple-600 hover:text-purple-800 transition" title="篩選">
                                    <i class="fa-solid fa-filter text-[10px]"></i>
                                </button>
                            </th>
                            <th class="py-1 px-2 font-semibold relative" style="width: 60px;">
                                材料名稱
                                <button onclick="showColumnFilter('name', this)" class="absolute right-0 top-1/2 -translate-y-1/2 text-purple-600 hover:text-purple-800 transition" title="篩選">
                                    <i class="fa-solid fa-filter text-[10px]"></i>
                                </button>
                            </th>
                            <th class="py-1 px-2 font-semibold relative" style="width: 60px;">
                                材質/型號
                                <button onclick="showColumnFilter('model', this)" class="absolute right-0 top-1/2 -translate-y-1/2 text-purple-600 hover:text-purple-800 transition" title="篩選">
                                    <i class="fa-solid fa-filter text-[10px]"></i>
                                </button>
                            </th>
                            <th class="py-1 px-2 font-semibold relative" style="width: 40px;">
                                原料商
                                <button onclick="showColumnFilter('supplier', this)" class="absolute right-0 top-1/2 -translate-y-1/2 text-purple-600 hover:text-purple-800 transition" title="篩選">
                                    <i class="fa-solid fa-filter text-[10px]"></i>
                                </button>
                            </th>
                            <th class="py-1 px-2 font-semibold relative" style="width: 40px;">
                                供應商
                                <button onclick="showColumnFilter('vendor', this)" class="absolute right-0 top-1/2 -translate-y-1/2 text-purple-600 hover:text-purple-800 transition" title="篩選">
                                    <i class="fa-solid fa-filter text-[10px]"></i>
                                </button>
                            </th>
                            <th class="py-1 px-2 font-semibold relative" style="width: 200px;">
                                廠內料號
                                <button onclick="showColumnFilter('partNo', this)" class="absolute right-0 top-1/2 -translate-y-1/2 text-purple-600 hover:text-purple-800 transition" title="篩選">
                                    <i class="fa-solid fa-filter text-[10px]"></i>
                                </button>
                            </th>
                            <th class="py-1 px-2 font-semibold relative" style="width: 60px;">
                                報告日期
                                <button onclick="showColumnFilter('reportDate', this)" class="absolute right-0 top-1/2 -translate-y-1/2 text-purple-600 hover:text-purple-800 transition" title="篩選">
                                    <i class="fa-solid fa-filter text-[10px]"></i>
                                </button>
                            </th>
                            <th class="py-1 px-2 font-semibold relative" style="width: 120px;">
                                報告到期日
                                <button onclick="showColumnFilter('expiry', this)" class="absolute right-0 top-1/2 -translate-y-1/2 text-purple-600 hover:text-purple-800 transition" title="篩選">
                                    <i class="fa-solid fa-filter text-[10px]"></i>
                                </button>
                            </th>
                            <th class="py-1 px-1 font-semibold text-center whitespace-nowrap" style="width: 40px;">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-purple-50 text-xs" id="tableBody">
                        <!-- 動態生成 -->
                    </tbody>
                </table>
            </div>
            <div id="noData" class="py-16 text-center text-slate-400">
                <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-2.5 shadow-inner">
                    <i class="fa-solid fa-folder-open text-lg"></i>
                </div>
                <p class="text-xs font-medium">目前尚無上傳任何工程文件，請點擊上方按鈕匯入或上傳檔案</p>
            </div>

            <!-- 分頁控制 -->
            <div id="paginationContainer" class="hidden flex items-center justify-between p-3 border-t border-purple-100 bg-purple-50/30">
                <div class="text-xs text-slate-600">
                    第 <span id="currentPage">1</span> 頁 / 共 <span id="totalPages">1</span> 頁 （共 <span id="totalRecords">0</span> 筆）
                </div>
                <div class="flex gap-1">
                    <button onclick="goToFirstPage()" class="text-purple-700 px-1.5 py-0.5 rounded text-[9px] font-semibold transition active:scale-95" style="background-color: rgba(252, 207, 232, 0.6);" onmouseover="this.style.backgroundColor='rgba(252, 207, 232, 0.8)'" onmouseout="this.style.backgroundColor='rgba(252, 207, 232, 0.6)'" title="首頁">
                        <i class="fa-solid fa-chevron-left"></i><i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button onclick="previousPage()" class="text-purple-700 px-1.5 py-0.5 rounded text-[9px] font-semibold transition active:scale-95" style="background-color: rgba(252, 207, 232, 0.6);" onmouseover="this.style.backgroundColor='rgba(252, 207, 232, 0.8)'" onmouseout="this.style.backgroundColor='rgba(252, 207, 232, 0.6)'" title="上一頁">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button onclick="nextPage()" class="text-purple-700 px-1.5 py-0.5 rounded text-[9px] font-semibold transition active:scale-95" style="background-color: rgba(252, 207, 232, 0.6);" onmouseover="this.style.backgroundColor='rgba(252, 207, 232, 0.8)'" onmouseout="this.style.backgroundColor='rgba(252, 207, 232, 0.6)'" title="下一頁">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <button onclick="goToLastPage()" class="text-purple-700 px-1.5 py-0.5 rounded text-[9px] font-semibold transition active:scale-95" style="background-color: rgba(252, 207, 232, 0.6);" onmouseover="this.style.backgroundColor='rgba(252, 207, 232, 0.8)'" onmouseout="this.style.backgroundColor='rgba(252, 207, 232, 0.6)'" title="末頁">
                        <i class="fa-solid fa-chevron-right"></i><i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- 隱藏檔案輸入框 - 用於上傳或更換檔案 -->
    <input type="file" id="singleFileUploadInput" accept=".pdf, .xlsx, .xls, .doc, .docx" class="hidden" onchange="handleSingleFileUpload(event)">

    <!-- 批次上傳與選擇資料夾彈窗 Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="static-panel rounded-3xl max-w-xl w-full p-5 shadow-2xl max-h-[90vh] flex flex-col text-xs">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-purple-800 flex items-center space-x-2 text-xs">
                    <i class="fa-solid fa-folder-tree text-purple-600 text-sm"></i>
                    <span>批次上傳原檔 / 選擇資料夾預覽 (智慧識別)</span>
                </h3>
                <button onclick="closeUploadModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <div class="flex border-b border-purple-100 mb-3">
                <button type="button" onclick="switchUploadTab('files')" id="tabFilesBtn" class="flex-1 py-1.5 font-semibold text-purple-800 border-b-2 border-purple-600 transition text-xs">選擇多個原檔</button>
                <button type="button" onclick="switchUploadTab('folder')" id="tabFolderBtn" class="flex-1 py-1.5 font-semibold text-slate-400 hover:text-slate-600 transition text-xs">選擇整個資料夾</button>
            </div>

            <form id="uploadForm" class="space-y-3 overflow-y-auto flex-1 pr-0.5">
                <div id="sectionFiles" class="space-y-1">
                    <label class="block font-semibold text-purple-900 uppercase mb-0.5 text-[10px]">上傳原始 PDF / Excel 檔案</label>

        function calculateExpiry(type, reportDateStr) {
            let upperType = (type || '').toUpperCase();

            if (!reportDateStr) {
                return { expiryText: '未判定', status: 'none', isExpired: false };
            }

            let repDate = new Date(reportDateStr);
            if (isNaN(repDate.getTime())) return { expiryText: '日期格式有誤', status: 'none', isExpired: false };

            // TDS、COA（含MTR）無期限
            if (upperType.includes('TDS') || upperType.includes('COA') || upperType === 'MTR') {
                return { expiryText: '無期限', status: 'none', isExpired: false };
            }

            let expDate = new Date(repDate);

            if (upperType === 'SDS' || upperType === 'MSDS' || upperType.includes('SDS')) {
                expDate.setFullYear(expDate.getFullYear() + 5);
            } else if (upperType === 'ROHS') {
                expDate.setFullYear(expDate.getFullYear() + 2);
            } else if (upperType === 'REACH') {
                expDate.setFullYear(expDate.getFullYear() + 1);
            } else {
                expDate.setFullYear(expDate.getFullYear() + 1);
            }

            let expiryText = expDate.toISOString().split('T')[0];
            let today = new Date();
            today.setHours(0,0,0,0);

            let diffTime = expDate - today;
            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (expDate < today) {
                return { expiryText, status: 'expired', isExpired: true };
            } else if (diffDays <= 30) {
                return { expiryText, status: 'warning', isExpired: false };
            } else {
                return { expiryText, status: 'valid', isExpired: false };
            }
        }

        function parseComprehensiveModel(parts, fileName) {
            // 移除括號內容後再檢查
            let cleanFileName = fileName.replace(/\s*\(.*\)/, '').trim();

            // 括號內容（如F050-121、Z011-06等）作為廠內料號，不作為型號
            // 型號應該從檔名主體部分（-分隔的各部分）識別

            // 從 parts 陣列中查找型號（跳過純中文parts和規格信息）
            // 優先找包含英文字母或特殊符號（如+、/）的parts
            for (let i = 1; i < parts.length; i++) {
                let part = parts[i].trim();

                // 排除日期
                if (part.match(/^\d{6,8}$/)) continue;

                // 排除文件類型
                if (part.toUpperCase().match(/^(MSDS|SDS|TDS|COA|MTR|UL|ROHS|REACH|PFAS|PFOA|PFOS|物性表|材質證明|材證)/)) continue;

                // 排除純中文詞（這通常是原料商）
                if (/^[一-龥]+$/.test(part)) continue;

                // 排除包含mm、μm等規格信息的parts
                if (part.match(/mm|μm|μ/i)) continue;

                // 如果包含英文字母、特殊符號+、/，或是1-5位純數字（如575），認為是型號起點
                if (/[A-Za-z]/.test(part) || part.includes('+') || part.includes('/') || /^\d{1,5}$/.test(part)) {
                    // 嘗試合併後續的部分形成完整型號（如 KF-96-350CS）
                    let model = part;
                    let j = i + 1;

                    // 如果當前部分包含英文（如KF、VTC70）或是純數字（如575），嘗試和後面的部分組合
                    if (/[A-Za-z]/.test(part) || /^\d{1,5}$/.test(part)) {
                        while (j < parts.length) {
                            let nextPart = parts[j].trim();
                            // 如果下一個包含數字或英文（允許空格、斜線等符號），合併它
                            // 例如：96、350CS、358 A/B、1、O、D 等都應該合併
                            if (/[0-9A-Za-z]/.test(nextPart) && !nextPart.match(/^\d{6,8}$/)) {
                                // 排除文件類型和純中文
                                if (nextPart.toUpperCase().match(/^(MSDS|SDS|TDS|COA|MTR|UL|ROHS|REACH|PFAS|PFOA|PFOS)/)) break;
                                if (/^[一-龥]+$/.test(nextPart)) break;
                                // 排除純中文
                                if (!/[A-Za-z0-9]/.test(nextPart)) break;

                                model += '-' + nextPart;
                                j++;
                            } else {
                                break;
                            }
                        }
                    }
                    return model;
                }
            }

            // 備用：從其他parts尋找型號（允許包含少量中文字如「系列」「型」等）
            // 規則：必須包含英文或數字，且不是純日期、不是文件類型
            for (let i = 2; i < parts.length; i++) {
                let clean = parts[i].trim();

                // 排除純日期（8位數字）
                if (clean.match(/^\d{8}$/)) continue;

                // 排除明顯的文件類型名稱（支援帶空格和數字的格式）
                if (clean.toUpperCase().match(/^(MSDS|SDS|TDS|COA|MTR|UL|ROHS|REACH|PFAS|PFOA|PFOS)/)) continue;

                // 檢查是否包含英文或數字
                if (/[A-Za-z0-9]/.test(clean)) {
                    // 檢查是否為純英文（如A、B等），如果是，看下一部分是否為數字，如果是則合併
                    if (/^[A-Za-z]+$/.test(clean) && i + 1 < parts.length) {
                        let nextPart = parts[i + 1].trim();
                        // 移除中文符號後檢查是否為數字組合
                        let cleanedNextPart = nextPart.replace(/[、，]/g, '');
                        // 如果下一部分是純數字或數字+字母組合（移除中文符號後），則合併
                        if (/^[0-9]+[A-Za-z0-9]*$/.test(cleanedNextPart)) {
                            return clean + '-' + nextPart;
                        }
                    }
                    // 這看起來像型號（允許包含中文字如「系列」）
                    return clean;
                }
            }

            // 使用cleanFileName而不是原始的fileName
            let regexMatch = cleanFileName.match(/([A-Za-z]+[-]?\d+[A-Za-z0-9]*)/g);
            if (regexMatch) {
                for (let match of regexMatch) {
                    let cleanMatch = match.trim();
                    if (cleanMatch.length >= 3 && !cleanMatch.match(/^(\d{6,8})$/) && !cleanMatch.match(/^(MSDS|SDS|TDS|COA|MTR|UL|ROHS|REACH|PFAS|PFOA|PFOS)/i)) {
                        return cleanMatch;
                    }
                }
            }

            for (let part of parts) {
                let clean = part.trim();
                if (/[A-Za-z0-9]/.test(clean) && clean.length <= 20) {
                    return clean;
                }
            }

            return parts.length > 1 ? parts[1].trim() : '未指定型號';
        }

        function parseFileInfo(fileName, fullPath = null) {
            // 提取檔案名稱（去除路徑）- 支援資料夾上傳時的相對路徑
            let baseName = fileName.split('/').pop() || fileName;
            let nameWithoutExt = baseName.substring(0, baseName.lastIndexOf('.')) || baseName;

            // 符號規範化：將中文符號轉換為英文符號
            nameWithoutExt = nameWithoutExt
                .replace(/／/g, '/').replace(/＼/g, '\\')  // 中文斜線
                .replace(/（/g, '(').replace(/）/g, ')')    // 中文括號
                .replace(/：/g, ':').replace(/；/g, ';')    // 中文冒號、分號
                .replace(/，/g, ',').replace(/、/g, ',')    // 中文逗號、頓號
                .replace(/　/g, ' ');                       // 中文空格

            let materialName = '未命名材料';
            let model = '未指定型號';
            let supplier = '未指定';
            let vendor = '未指定';
            let docType = 'TDS';
            let reportDate = new Date().toISOString().split('T')[0];
            let partNo = '未指定';

            // 從資料夾名稱中提取供應商 - 供應商資訊一律提取資料夾名稱
            if (fullPath) {
                // 標準化路徑分隔符為 /
                let normalizedPath = fullPath.replace(/\\/g, '/');

                // 如果包含 / 表示有資料夾結構
                if (normalizedPath.includes('/')) {
                    // 分割路徑並移除空部分
                    let pathParts = normalizedPath.split('/');
                    let cleanParts = [];
                    for (let part of pathParts) {
                        if (part && part.trim()) {
                            cleanParts.push(part.trim());
                        }
                    }

                    // 如果有多個路徑部分，第一個就是資料夾名稱（供應商）
                    if (cleanParts.length > 1) {
                        vendor = cleanParts[0]; // 第一個非空部分為供應商
                    }
                }
            }

            // 備用方案：如果vendor仍未指定，檢查是否有手動輸入的供應商（「選擇多個原檔」模式）
            if (vendor === '未指定') {
                try {
                    let vendorInputElement = document.getElementById('vendorInput');
                    if (vendorInputElement && vendorInputElement.value && vendorInputElement.value.trim()) {
                        vendor = vendorInputElement.value.trim();
                    }
                } catch (e) {
                    // 忽略任何錯誤
                }
            }

            const lowerName = nameWithoutExt.toLowerCase();

            if (lowerName.includes('ul94') || lowerName.includes('ul 94')) {
                docType = 'UL94';
            } else if (lowerName.includes('物性表') || lowerName.includes('tds')) {
                docType = 'TDS';
            } else if (lowerName.includes('材質證明') || lowerName.includes('材證') || lowerName.includes('coa') || lowerName.includes('mtr')) {
                docType = 'COA';
            } else if (lowerName.includes('msds') || lowerName.includes('sds')) {
                docType = 'SDS';
            } else if (lowerName.includes('rohs')) {
                docType = 'ROHS';
            } else if (lowerName.includes('reach') || lowerName.includes('切結書')) {
                docType = 'REACH';
            } else if (lowerName.includes('pfas')) {
                docType = 'PFAS';
            } else if (lowerName.includes('pfoa') || lowerName.includes('pfos')) {
                docType = 'PFOA、PFOS';
            } else if (lowerName.includes('鹵素')) {
                docType = '鹵素';
            }

            // 檢測是否標記為「無日期」
            const hasNoDate = nameWithoutExt.includes('無日期');

            // 提取括號內的料號（提取最後一個括號內的內容）
            let lastMatchParen = nameWithoutExt.lastIndexOf('(');
            if (lastMatchParen !== -1) {
                let lastCloseParen = nameWithoutExt.lastIndexOf(')');
                if (lastCloseParen > lastMatchParen) {
                    let content = nameWithoutExt.substring(lastMatchParen + 1, lastCloseParen).trim();
                    if (content) {
                        partNo = content;
                    }
                }
            }

            // 移除括號內容後進行分割
            let cleanBaseName = nameWithoutExt.replace(/\s*\(.*\)/, '').trim();
            let parts = cleanBaseName.split('-').map(p => p.trim()).filter(p => p);

            if (parts.length > 0 && parts[0]) materialName = parts[0].trim();

            // 日期識別（如果標記為「無日期」則跳過）
            if (!hasNoDate) {
                parts.forEach((part) => {
                    let clean = part.trim();
                    if (clean.match(/^(\d{6,8})$/)) {
                        let numStr = clean;
                        let candidateDate = null;
                        let month = 0, day = 0;

                        if (numStr.length === 8) {
                            month = parseInt(numStr.substring(4,6));
                            day = parseInt(numStr.substring(6,8));
                            if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                                candidateDate = `${numStr.substring(0,4)}-${numStr.substring(4,6)}-${numStr.substring(6,8)}`;
                            }
                        } else if (numStr.length === 6) {
                            month = parseInt(numStr.substring(2,4));
                            day = parseInt(numStr.substring(4,6));
                            if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                                candidateDate = `20${numStr.substring(0,2)}-${numStr.substring(2,4)}-${numStr.substring(4,6)}`;
                            }
                        }

                        if (candidateDate) {
                            reportDate = candidateDate;
                        }
                    }
                });
            } else {
                reportDate = '未指定'; // 如果標記為無日期，日期設為「未指定」
            }

            // 型號識別
            model = parseComprehensiveModel(parts, nameWithoutExt);

            // 原料商識別（檔名中的廠商辨識 - 尋找第二個或後續的純中文部分）
            if (parts.length > 2) {
                // 策略：parts[0]是材料，parts[1]可能是規格/型號，parts[2]及之後的中文詞是原料商
                // 尋找第二個中文詞組作為原料商（跳過parts[0]和parts[1]）
                for (let i = 2; i < parts.length; i++) {
                    let clean = parts[i].trim();

                    // 排除純數字、文件類型等
                    if (clean.match(/^\d{8}$/)) continue;
                    if (clean.toUpperCase().match(/^(MSDS|SDS|TDS|COA|MTR|UL|ROHS|REACH|PFAS|PFOA|PFOS)/)) continue;

                    // 尋找純中文或主要是中文的詞組
                    if (clean.match(/^[一-龥]+$/) || (clean.match(/[一-龥]/) && !clean.match(/[A-Za-z0-9]/))) {
                        supplier = clean; // 找到原料商
                        break;
                    }
                }

                // 如果沒有找到，則嘗試從parts[1]開始尋找（備用方案）
                if (supplier === '未指定') {
                    for (let i = 1; i < parts.length; i++) {
                        let clean = parts[i].trim();
                        if (clean.match(/^\d{8}$/)) continue;
                        if (clean.toUpperCase().match(/^(MSDS|SDS|TDS|COA|MTR|UL|ROHS|REACH|PFAS|PFOA|PFOS)/)) continue;
                        if (clean.match(/^[一-龥]+$/) || (clean.match(/[一-龥]/) && !clean.match(/[A-Za-z0-9]/))) {
                            supplier = clean;
                            break;
                        }
                    }
                }
            } else if (parts.length > 1) {
                // 檔名部分較少時，尋找第一個非材料名的中文詞
                for (let i = 1; i < parts.length; i++) {
                    let clean = parts[i].trim();
                    if (clean.match(/^\d{8}$/)) continue;
                    if (clean.toUpperCase().match(/^(MSDS|SDS|TDS|COA|MTR|UL|ROHS|REACH|PFAS|PFOA|PFOS)/)) continue;
                    if (clean.match(/^[一-龥]+$/) || (clean.match(/[一-龥]/) && !clean.match(/[A-Za-z0-9]/))) {
                        supplier = clean;
                        break;
                    }
                }
            }

            return { materialName, model, supplier, vendor, partNo, docType, reportDate };
        }

        function handleFileSelection(inputElement) {
            const files = inputElement.files;
            if (!files || files.length === 0) return;
            stagedFilesArray = Array.from(files);
            stagedFileObjects = Array.from(files);

            // 診斷webkitRelativePath是否有效
            let hasRelativePath = false;
            for (let file of stagedFilesArray) {
                if (file.webkitRelativePath && file.webkitRelativePath.length > 0) {
                    hasRelativePath = true;
                    console.log('文件路徑信息:', {
                        name: file.name,
                        webkitRelativePath: file.webkitRelativePath
                    });
                }
            }
            if (!hasRelativePath) {
                console.warn('警告：未檢測到 webkitRelativePath。請使用「選擇整個資料夾」標籤頁上傳資料夾。');
            }

            renderPreviewList();
        }

            const previewList = document.getElementById('previewList');

            submitBtn.classList.remove('opacity-50', 'pointer-events-none');

            stagedFilesArray.forEach((file, index) => {

                const fullPath = file.webkitRelativePath && file.webkitRelativePath.length > 0 ? file.webkitRelativePath : file.name;

        function filterCurrentData() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            return materialsData.filter(item => {
                const expiry = calculateExpiry(item.type, item.reportDate);
                const matchCategory = (currentFilter === 'all' || item.type === currentFilter);
                const matchKeyword = item.type.toLowerCase().includes(keyword) ||
                                     item.name.toLowerCase().includes(keyword) ||
                                     item.supplier.toLowerCase().includes(keyword) ||
                                     (item.vendor && item.vendor.toLowerCase().includes(keyword)) ||
                                     (item.model && item.model.toLowerCase().includes(keyword)) ||
                                     (item.partNo && item.partNo.toLowerCase().includes(keyword)) ||
                                     item.reportDate.toLowerCase().includes(keyword) ||
                                     expiry.expiryText.toLowerCase().includes(keyword);
                return matchCategory && matchKeyword;
            });
        }

                } else if (expiry.status === 'none') {
                    expiryBadge = `<span class="text-slate-400 italic">${expiry.expiryText}</span>`;

                const tr = document.createElement('tr');
                tr.className = `transition border-b border-purple-50 animate-row ${expiry.status === 'expired' ? 'bg-red-50/40 hover:bg-red-50/80' : 'hover:bg-purple-50/50'}`;
                tr.style.animationDelay = `${idx * 0.04}s`;
                tr.innerHTML = `

                        <input type="checkbox" value="${item.id}" onclick="toggleSelectItem(${item.id}); updateBatchDeleteBtn()" class="row-checkbox rounded border-slate-300 text-purple-600 focus:ring-purple-500 cursor-pointer" ${selectedItemIds.has(item.id) ? 'checked' : ''}>
                    </td>
                    <td class="py-1 px-0 text-center">
                        <span class="inline-block px-0.5 py-0.5 font-semibold rounded-md border text-[10px] whitespace-nowrap ${badgeClass}">${item.type}</span>
                    </td>
                    <td class="py-1 px-1 text-slate-800 font-semibold whitespace-nowrap cursor-pointer hover:bg-purple-50/60 transition group" onclick="makeEditable(this, ${item.id}, 'name')" title="點選可修改材料名稱">
                        <span class="border-b border-dashed border-purple-200 group-hover:border-purple-600">${item.name}</span>
                    </td>
                    <td class="py-1 px-3 text-purple-700 font-semibold cursor-pointer hover:bg-purple-50/60 transition group" onclick="makeEditable(this, ${item.id}, 'model')" title="點選可修改型號">
                        <span class="border-b border-dashed border-purple-200 group-hover:border-purple-600">${item.model || '未指定'}</span>

                    <td class="py-1 px-3 text-slate-800 font-medium cursor-pointer hover:bg-purple-50/60 transition group" onclick="makeEditable(this, ${item.id}, 'supplier')" title="點選可修改原料商">
                        <span class="border-b border-dashed border-purple-200 group-hover:border-purple-600">${item.supplier}</span>
                    </td>
                    <td class="py-1 px-3 text-slate-800 font-medium cursor-pointer hover:bg-purple-50/60 transition group" onclick="makeEditable(this, ${item.id}, 'vendor')" title="點選可修改供應商">
                        <span class="border-b border-dashed border-purple-200 group-hover:border-purple-600">${item.vendor || '未指定'}</span>
                    </td>
                    <td class="py-1 px-3 text-emerald-800 font-mono text-[11px] bg-emerald-50/80 rounded-lg cursor-pointer hover:bg-purple-50/60 transition group" onclick="makeEditable(this, ${item.id}, 'partNo')" title="點選可修改廠內料號">
                        <span class="border-b border-dashed border-emerald-300 group-hover:border-emerald-600">${item.partNo || '未指定'}</span>

                            <i class="fa-solid fa-download text-[8px]"></i>

                        <button onclick="triggerFileUpload(${item.id})" class="inline-block bg-blue-600 hover:bg-blue-500 text-white px-1.5 py-0.5 rounded-lg transition shadow-sm active:scale-95" title="上傳或更換檔案">
                            <i class="fa-solid fa-upload text-[8px]"></i>
                        </button>
                        <button onclick="deleteSingleItem(${item.id})" class="block mx-auto text-slate-400 hover:text-red-600 p-0.5 rounded-lg hover:bg-red-50 transition" style="margin-left: auto; margin-right: auto;" title="刪除文件">
                            <i class="fa-solid fa-trash-can text-[8px]"></i>
                        </button>
                    </td>

            document.getElementById('stat-expired').innerText = expiredCount;

        function toggleSelectAll(masterCheckbox) {
            if (masterCheckbox.checked) {
                // 全選當前頁面的所有項目
                document.querySelectorAll('.row-checkbox').forEach(cb => {
                    cb.checked = true;
                    selectedItemIds.add(parseInt(cb.value));
                });
            } else {
                // 取消全選當前頁面的所有項目
                document.querySelectorAll('.row-checkbox').forEach(cb => {
                    cb.checked = false;
                    selectedItemIds.delete(parseInt(cb.value));
                });
            }
            updateBatchDeleteBtn();
        }

        function toggleSelectItem(itemId) {
            if (selectedItemIds.has(itemId)) {
                selectedItemIds.delete(itemId);
            } else {
                selectedItemIds.add(itemId);
            }
        }

        function updateBatchDeleteBtn() {
            const btn = document.getElementById('batchDeleteBtn');
            const btnText = document.getElementById('batchDeleteText');
            if (selectedItemIds.size > 0) {
                btn.classList.remove('hidden');
                btn.classList.add('flex');
                btnText.innerText = `刪除已選 (${selectedItemIds.size})`;
            } else {
                btn.classList.remove('flex');
                btn.classList.add('hidden');
            }
        }

        function deleteSelectedItems() {
            if (selectedItemIds.size === 0) return;
            if (confirm(`確定要刪除選取的 ${selectedItemIds.size} 筆工程文件嗎？`)) {
                const idsToDelete = Array.from(selectedItemIds);
                materialsData = materialsData.filter(item => {
                    if (idsToDelete.includes(item.id)) {
                        if (fileBlobMap[item.id]) {
                            URL.revokeObjectURL(fileBlobMap[item.id]);
                            delete fileBlobMap[item.id];
                        }
                        return false;
                    }
                    return true;
                });

                // 清空已刪除的選擇
                selectedItemIds.clear();

                saveToLocalStorage();

                // 刪除後自動調整頁碼
                const data = filterCurrentData();
                const totalPages = Math.ceil(data.length / itemsPerPage);
                if (currentPage > totalPages) {
                    currentPage = Math.max(1, totalPages);
                }

                renderTable(data);
            }
        }

        function deleteSingleItem(id) {
            if (confirm('確定要刪除這筆工程文件紀錄嗎？')) {
                materialsData = materialsData.filter(item => {
                    if (item.id === id) {
                        if (fileBlobMap[id]) {
                            URL.revokeObjectURL(fileBlobMap[id]);
                            delete fileBlobMap[id];
                        }
                        return false;
                    }
                    return true;
                });
                saveToLocalStorage();
                filterTable();
            }
        }

        function triggerFileUpload(id) {
            currentUploadItemId = id;
            document.getElementById('singleFileUploadInput').click();
        }

        function handleSingleFileUpload(event) {
            const file = event.target.files[0];
            if (!file || !currentUploadItemId) return;

            const item = materialsData.find(i => i.id === currentUploadItemId);
            if (!item) return;

            const blobUrl = URL.createObjectURL(file);

            // 移除舊的 Blob URL
            if (fileBlobMap[currentUploadItemId]) {
                URL.revokeObjectURL(fileBlobMap[currentUploadItemId]);
            }

            // 更新檔案資訊
            fileBlobMap[currentUploadItemId] = blobUrl;
            item.fileName = file.name;
            item.fileUrl = blobUrl;

            saveToLocalStorage();
            filterTable();
            alert(`檔案已成功上傳並替換：${file.name}`);

            // 重置
            event.target.value = '';
            currentUploadItemId = null;
        }

            const btnBase = 'category-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition shadow-sm';
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = `${btnBase} bg-purple-100 text-purple-800 hover:bg-purple-200`;
            });
            document.getElementById(`cat-${category}`).className = `${btnBase} bg-purple-700 text-white`;
            filterTable();
        }

        function filterTable() {

        function clearSearch() {

        function showColumnFilter(columnField, button) {
            // 移除現有的篩選菜單（如果已開啟則關閉）
            const existingMenu = document.querySelector('.column-filter-menu');
            if (existingMenu) {
                existingMenu.remove();
                return;
            }

            // 獲取該欄位的所有唯一值
            let values;
            if (columnField === 'reportDate') {
                // 報告日期改為年份篩選
                values = [...new Set(materialsData.map(item => {
                    const date = item.reportDate;
                    return date ? date.split('-')[0] : '未指定'; // 提取年份
                }).filter(v => v))]
                    .sort()
                    .reverse(); // 按年份降序排列
            } else if (columnField === 'expiry') {
                // 報告到期日改為年份篩選
                values = [...new Set(materialsData.map(item => {
                    const expiryDate = calculateExpiry(item.type, item.reportDate).expiryText;
                    return expiryDate && expiryDate !== '未判定' && expiryDate !== '日期格式有誤'
                        ? expiryDate.split('-')[0]
                        : '未指定'; // 提取年份
                }).filter(v => v))]
                    .sort()
                    .reverse(); // 按年份降序排列
            } else {
                values = [...new Set(materialsData.map(item => item[columnField] || '未指定').filter(v => v))]
                    .sort()
                    .slice(0, 20); // 限制顯示20個值
            }

            // 創建篩選菜單
            const menu = document.createElement('div');
            menu.className = 'column-filter-menu absolute bg-white border border-purple-300 rounded-lg shadow-lg z-50 min-w-[150px] max-h-[300px] overflow-y-auto';
            menu.style.top = (button.offsetTop + button.offsetHeight) + 'px';
            menu.style.left = (button.offsetLeft - 120) + 'px';

            // 添加清除篩選選項
            const clearOption = document.createElement('div');
            clearOption.className = 'px-3 py-1.5 text-[11px] cursor-pointer hover:bg-purple-100 border-b border-purple-100';
            clearOption.textContent = '全部';
            clearOption.onclick = () => {
                // 移除該欄位的篩選狀態
                filteredColumns.delete(columnField);
                // 恢復圖標顏色和閃爍效果
                const icon = button.querySelector('i');
                if (icon) {
                    icon.className = 'fa-solid fa-filter text-[10px]';
                    icon.classList.remove('filter-icon-blinking');
                }
                button.classList.remove('text-amber-600');
                button.classList.add('text-purple-600');
                filterTable();
                menu.remove();
            };
            menu.appendChild(clearOption);

            // 添加值選項
            values.forEach(value => {
                const option = document.createElement('div');
                option.className = 'px-3 py-1.5 text-[11px] cursor-pointer hover:bg-purple-100 font-medium text-purple-800';
                option.textContent = value;
                option.onclick = () => {
                    currentPage = 1;
                    let filtered;
                    if (columnField === 'reportDate') {
                        // 報告日期按年份篩選
                        filtered = filterCurrentData().filter(item => {
                            const year = item.reportDate ? item.reportDate.split('-')[0] : '未指定';
                            return year === value;
                        });
                    } else if (columnField === 'expiry') {
                        // 報告到期日按年份篩選
                        filtered = filterCurrentData().filter(item => {
                            const expiryDate = calculateExpiry(item.type, item.reportDate).expiryText;
                            const year = (expiryDate && expiryDate !== '未判定' && expiryDate !== '日期格式有誤')
                                ? expiryDate.split('-')[0]
                                : '未指定';
                            return year === value;
                        });
                    } else {
                        filtered = filterCurrentData().filter(item =>
                            (item[columnField] || '未指定') === value
                        );
                    }

                    // 標記該欄位為已篩選並改變圖標顏色和添加閃爍效果
                    filteredColumns.add(columnField);
                    button.classList.remove('text-purple-600');
                    button.classList.add('text-amber-600');

                    // 添加閃爍動畫到圖標
                    const icon = button.querySelector('i');
                    if (icon) {
                        icon.classList.add('filter-icon-blinking');
                    }

                    renderTable(filtered);
                    menu.remove();
                };
                menu.appendChild(option);
            });

            button.parentElement.style.position = 'relative';
            button.parentElement.appendChild(menu);

            // 點擊外部時自動關閉菜單
            setTimeout(() => {
                const closeMenuListener = (e) => {
                    if (!menu.contains(e.target) && e.target !== button) {
                        menu.remove();
                        document.removeEventListener('click', closeMenuListener);
                    }
                };
                document.addEventListener('click', closeMenuListener);
            }, 0);
        }

        function nextPage() {
            const data = filterCurrentData();
            const totalPages = Math.ceil(data.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable(data);
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable(filterCurrentData());
            }
        }

        function goToFirstPage() {
            if (currentPage !== 1) {
                currentPage = 1;
                renderTable(filterCurrentData());
            }
        }

        function goToLastPage() {
            const data = filterCurrentData();
            const totalPages = Math.ceil(data.length / itemsPerPage);
            if (currentPage !== totalPages) {
                currentPage = totalPages;
                renderTable(data);
            }
        }

        function openUploadModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
            document.getElementById('uploadForm').reset();
            stagedFilesArray = [];
            stagedFileObjects = [];
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('submitUploadBtn').classList.add('opacity-50', 'pointer-events-none');
            switchUploadTab('files');
        }

        function handleBatchUpload(event) {
            try {
                if (event) event.preventDefault();
                if (stagedFilesArray.length === 0) {
                    alert('請先選擇上傳檔案');
                    return;
                }

                // 檢查是否為「選擇多個原檔」模式（即是否有檔案缺乏webkitRelativePath）
                let isFileSelectMode = false;
                for (let file of stagedFilesArray) {
                    if (!file.webkitRelativePath || file.webkitRelativePath.length === 0) {
                        isFileSelectMode = true;
                        break;
                    }
                }

                // 如果是「選擇多個原檔」模式，檢查供應商是否已填寫
                if (isFileSelectMode) {
                    let vendorInput = document.getElementById('vendorInput');
                    if (!vendorInput || !vendorInput.value || !vendorInput.value.trim()) {
                        alert('警告：「選擇多個原檔」模式中，供應商欄位為必填項。\n\n請在「供應商」欄位輸入供應商名稱後再上傳。');
                        return;
                    }
                }

                let addedCount = 0;
                let duplicateFiles = [];
                let nextId = materialsData.length > 0 ? Math.max(...materialsData.map(i => i.id)) + 1 : 1;

                stagedFilesArray.forEach((file, idx) => {
                    // 檢查檔案是否已存在
                    const isDuplicate = materialsData.some(item => item.fileName === file.name);
                    if (isDuplicate) {
                        duplicateFiles.push(file.name);
                        return; // 跳過這個檔案
                    }

                    // 優先使用 webkitRelativePath（完整相對路徑），否則使用 file.name
                    const fullPath = file.webkitRelativePath && file.webkitRelativePath.length > 0 ? file.webkitRelativePath : file.name;
                    const info = parseFileInfo(file.name, fullPath);
                    const fileObj = stagedFileObjects[idx] || file;
                    const blobUrl = URL.createObjectURL(fileObj);

                    const newId = nextId++;
                    fileBlobMap[newId] = blobUrl;

                    materialsData.unshift({
                        id: newId,
                        type: info.docType,
                        name: info.materialName,
                        model: info.model,
                        supplier: info.supplier,
                        vendor: info.vendor,
                        partNo: info.partNo,
                        reportDate: info.reportDate,
                        fileName: file.name,
                        fileUrl: blobUrl
                    });
                    addedCount++;
                });

                // 如果有重複檔案，顯示警告
                if (duplicateFiles.length > 0) {
                    alert(`警告：以下檔案已存在，已跳過匯入：\n\n${duplicateFiles.join('\n')}`);
                }

                saveToLocalStorage();
                filterTable();
                closeUploadModal();
                alert(`成功自動識別型號與供應商並匯入 ${addedCount} 筆檔案！\n\n提醒：建議您立即點擊「匯出備份」按鈕進行資料備份，以防資料遺失。`);
            } catch (error) {
                console.error('上傳失敗:', error);
                alert('上傳時發生錯誤：' + error.message + '\n\n請檢查瀏覽器控制台查看詳細信息。');
            }
        }

        function handleExcelImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    if (json.length === 0) { alert('Excel 無資料'); return; }

                    let nextId = materialsData.length > 0 ? Math.max(...materialsData.map(i => i.id)) + 1 : 1;
                    let importCount = 0;

                    json.forEach(row => {
                        const rawType = (row['文件類型'] || row['Type'] || '').toString();
                        let type = rawType.toUpperCase();

                        const name = row['材料名稱'] || row['Name'] || '未命名材料';
                        const lowerName = name.toLowerCase();
                        if (!['UL94', 'TDS', 'COA', 'SDS', 'ROHS', 'REACH', 'PFAS', 'PFOA、PFOS', '鹵素'].includes(type)) {
                            if (lowerName.includes('ul94') || lowerName.includes('ul 94')) type = 'UL94';
                            else if (lowerName.includes('物性表') || lowerName.includes('tds')) type = 'TDS';
                            else if (lowerName.includes('材質證明') || lowerName.includes('材證') || lowerName.includes('coa') || lowerName.includes('mtr')) type = 'COA';
                            else if (lowerName.includes('msds') || lowerName.includes('sds')) type = 'SDS';
                            else if (lowerName.includes('rohs')) type = 'ROHS';
                            else if (lowerName.includes('reach') || lowerName.includes('切結書')) type = 'REACH';
                            else if (lowerName.includes('pfas')) type = 'PFAS';
                            else if (lowerName.includes('pfoa') || lowerName.includes('pfos')) type = 'PFOA、PFOS';
                            else if (lowerName.includes('鹵素')) type = '鹵素';
                            else type = 'TDS';
                        }

                        const model = row['材質/型號'] || row['Model'] || '未指定型號';
                        let supplier = row['供應商'] || row['Supplier'] || '未指定供應商';

                        if (supplier === '未指定供應商') {
                            for (let known of KNOWN_SUPPLIERS) {
                                if (name.includes(known)) {
                                    supplier = known;
                                    break;
                                }
                            }
                        }

                        const partNo = row['廠內料號'] || row['PartNo'] || '未指定';
                        const reportDate = row['報告日期'] || row['ReportDate'] || new Date().toISOString().split('T')[0];

                        const newId = nextId++;
                        materialsData.unshift({
                            id: newId,
                            type: type,
                            name: name,
                            model: model,
                            supplier: supplier,
                            vendor: row['供應商'] || row['Vendor'] || '未指定',
                            partNo: partNo,
                            reportDate: reportDate,
                            fileName: `${name}.xlsx`,
                            fileUrl: '#'
                        });
                        importCount++;
                    });

                    saveToLocalStorage();
                    filterTable();
                    alert(`成功從 Excel 匯入 ${importCount} 筆資料！`);
                } catch (err) {
                    alert('Excel 解析失敗');
                }
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        // ===== 自動定時備份 =====
        const AUTO_BACKUP_KEY = 'materials_hub_autobackup_v103';
        const AUTO_BACKUP_INTERVAL_MS = 30 * 60 * 1000; // 每 30 分鐘
        const AUTO_BACKUP_MAX = 10;                     // 最多保留 10 個版本

        function loadAutoBackups() {
            try {
                return JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY) || '[]');
            } catch (e) {
                return [];
            }
        }

        function formatBackupTime(iso) {
            return new Date(iso).toLocaleString('zh-TW', { hour12: false });
        }

        function runAutoBackup(manual) {
            if (!manual && materialsData.length === 0) return;
            try {
                const list = loadAutoBackups();
                list.unshift({
                    time: new Date().toISOString(),
                    count: materialsData.length,
                    materials: materialsData
                });
                list.splice(AUTO_BACKUP_MAX);
                localStorage.setItem(AUTO_BACKUP_KEY, JSON.stringify(list));
                updateAutoBackupStatus();
                if (manual) {
                    renderBackupList();
                    alert('已建立備份');
                }
            } catch (e) {
                console.error('自動備份失敗:', e);
                if (manual) alert('備份失敗：瀏覽器儲存空間可能已滿');
            }
        }

        function updateAutoBackupStatus() {
            const el = document.getElementById('autoBackupStatus');
            if (!el) return;
            const list = loadAutoBackups();
            el.innerText = list.length
                ? `每 30 分鐘自動備份一次，目前保留 ${list.length} 個版本，最近一次：${formatBackupTime(list[0].time)}`
                : '尚無備份，系統將於啟用後自動建立第一份備份';
        }

        function renderBackupList() {
            const container = document.getElementById('backupList');
            const list = loadAutoBackups();
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-6">尚無備份</p>';
                return;
            }
            list.forEach((snap, idx) => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between border border-purple-100 rounded-xl p-2.5 bg-white';

                const info = document.createElement('div');
                info.innerHTML = `<div class="font-semibold text-purple-900">${formatBackupTime(snap.time)}</div>` +
                                 `<div class="text-[10px] text-slate-500">共 ${snap.count} 筆資料</div>`;

                const btn = document.createElement('button');
                btn.className = 'px-2.5 py-1 bg-purple-700 hover:bg-purple-600 text-white rounded-lg text-[10px] font-semibold transition active:scale-95';
                btn.innerText = '還原';
                btn.onclick = () => restoreAutoBackup(idx);

                row.appendChild(info);
                row.appendChild(btn);
                container.appendChild(row);
            });
        }

        function openBackupListModal() {
            renderBackupList();
            updateAutoBackupStatus();
            const modal = document.getElementById('backupModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeBackupListModal() {
            const modal = document.getElementById('backupModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function restoreAutoBackup(idx) {
            const list = loadAutoBackups();
            const snap = list[idx];
            if (!snap) return;
            if (!confirm(`確認還原到 ${formatBackupTime(snap.time)} 的備份嗎？目前資料將被覆蓋（還原前會先自動保存目前狀態）。`)) return;

            runAutoBackup(false); // 還原前先保存目前狀態
            materialsData = snap.materials;
            selectedItemIds.clear();
            saveToLocalStorage();
            filterTable();
            closeBackupListModal();
            alert('還原成功！');
        }

        window.onload = function() {
            renderTable(materialsData);
            updateAutoBackupStatus();

            // 啟動時：若距離上次備份已超過間隔（或尚無備份），立即備份一次
            const list = loadAutoBackups();
            if (list.length === 0 || Date.now() - new Date(list[0].time).getTime() >= AUTO_BACKUP_INTERVAL_MS) {
                runAutoBackup(false);
            }

            // 定時自動備份
            setInterval(() => runAutoBackup(false), AUTO_BACKUP_INTERVAL_MS);

            // 桌面提醒：載入時檢查一次，之後每 10 分鐘檢查是否已到提醒時間
            updateNotifyButton();
            checkExpiryReminder(false);
            setInterval(() => checkExpiryReminder(false), 10 * 60 * 1000);
        };

        // ===== 瀏覽器桌面提醒 =====
        const REMINDER_HOUR = 8;      // 提醒時間：時
        const REMINDER_MINUTE = 30;   // 提醒時間：分
        const REMINDER_LAST_KEY = 'materials_hub_reminder_last_v103';

        function getExpirySummary() {
            const expired = [];
            const warning = [];
            materialsData.forEach(item => {
                const e = calculateExpiry(item.type, item.reportDate);
                if (e.status === 'expired') expired.push(item);
                else if (e.status === 'warning') warning.push(item);
            });
            return { expired, warning };
        }

        function updateNotifyButton() {
            const btn = document.getElementById('notifyBtn');
            const txt = document.getElementById('notifyBtnText');
            if (!btn || !txt) return;
            if (!('Notification' in window)) {
                txt.innerText = '瀏覽器不支援通知';
                btn.disabled = true;
                return;
            }
            if (Notification.permission === 'granted') {
                txt.innerText = '桌面提醒已開啟';
            } else if (Notification.permission === 'denied') {
                txt.innerText = '通知已被封鎖';
            } else {
                txt.innerText = '開啟桌面提醒';
            }
        }

        async function enableBrowserNotifications() {
            if (!('Notification' in window)) {
                alert('此瀏覽器不支援桌面通知');
                return;
            }
            if (Notification.permission === 'denied') {
                alert('通知已被封鎖，請至瀏覽器的網站設定中允許通知後再試');
                return;
            }
            const perm = await Notification.requestPermission();
            updateNotifyButton();
            if (perm === 'granted') {
                sendExpiryNotification(true);
                alert(`已開啟桌面提醒，系統將於每天 ${String(REMINDER_HOUR).padStart(2, '0')}:${String(REMINDER_MINUTE).padStart(2, '0')} 檢查一次效期`);
            } else if (perm === 'denied') {
                alert('通知已被封鎖，請至瀏覽器的網站設定中允許通知');
            }
        }

        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // 定時檢查：達到提醒時間且當天尚未提醒過才發送
        function checkExpiryReminder(force) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            if (!force) {
                const now = new Date();
                const nowMinutes = now.getHours() * 60 + now.getMinutes();
                if (nowMinutes < REMINDER_HOUR * 60 + REMINDER_MINUTE) return;
                try {
                    if (localStorage.getItem(REMINDER_LAST_KEY) === todayKey()) return;
                } catch (e) { /* 忽略儲存錯誤 */ }
            }
            sendExpiryNotification(force);
        }

        function sendExpiryNotification(force) {
            const { expired, warning } = getExpirySummary();

            if (!force && expired.length === 0 && warning.length === 0) {
                try { localStorage.setItem(REMINDER_LAST_KEY, todayKey()); } catch (e) {}
                return;
            }

            let body;
            if (expired.length === 0 && warning.length === 0) {
                body = '目前沒有已過期或即將到期的文件';
            } else {
                body = `已過期 ${expired.length} 筆、即將到期 ${warning.length} 筆`;
                if (expired.length > 0) {
                    const names = expired.slice(0, 3).map(i => `${i.name}（${i.type}）`).join('、');
                    body += `\n過期：${names}${expired.length > 3 ? ' 等' : ''}`;
                }
            }

            try {
                const n = new Notification('文件效期提醒', { body: body, tag: 'expiry-reminder' });
                n.onclick = () => { window.focus(); n.close(); };
            } catch (e) {
                console.error('桌面通知失敗:', e);
            }

            try { localStorage.setItem(REMINDER_LAST_KEY, todayKey()); } catch (e) {}
        }
    </script>
